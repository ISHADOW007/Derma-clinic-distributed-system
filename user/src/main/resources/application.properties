spring.application.name=user

# =========================
# Server
# =========================
server.port=8080


# =========================
# Eureka
# =========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.jersey.enabled=false

# Register IP instead of machine hostname
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1


# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/userSatyam
spring.datasource.username=postgres
spring.datasource.password=satyam
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=*


# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


jwt.secret-key=your-super-secret-key-change-this